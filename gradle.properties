# Android Gradle Configuration
# This file contains common Gradle settings for building WitherHost APK

# Project-wide Gradle settings
org.gradle.jvmargs=-Xmx2048m -XX:MaxPermSize=512m

# Enable AndroidX
android.useAndroidX=true

# Enable Jetifier
android.enableJetifier=true

# Build features
android.enableDexingArtifactTransform=true
android.useDeprecatedNdk=false

# Enable build features for performance
android.enableD8=true

# Version info
VERSION_CODE=1
VERSION_NAME=1.0.0

# Signing (configure in android/app/build.gradle instead)
# Do not commit signing keys to version control!

# Note: This file is optional but recommended for consistency
